name: Build FlowForge APK

# Builds an installable APK in the cloud. Start it from the GitHub mobile app or the website
# (Actions -> Build FlowForge APK -> Run workflow), then install the APK it attaches to the
# release. No computer, no Android Studio.

on:
  push:
    branches: ["**"]
    paths:
      - "flowforge/**"
      - ".github/workflows/flowforge-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowforge

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --console=plain

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --console=plain

      - name: Name the APK
        id: apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/FlowForge-${{ github.run_number }}.apk"
          echo "path=flowforge/out/FlowForge-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowForge-apk-${{ github.run_number }}
          path: flowforge/out/*.apk
          if-no-files-found: error

      - name: Publish a release you can install from your phone
        uses: softprops/action-gh-release@v2
        with:
          tag_name: flowforge-v${{ github.run_number }}
          name: FlowForge build ${{ github.run_number }}
          body: |
            Tap the `.apk` below on your Android phone to install.

            Built from `${{ github.sha }}`. Signed with the standard Android debug key, so
            you will need to allow installs from unknown sources the first time.
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
